name: Deploy BoxLab Beta

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen BoxLab Beta source
        uses: actions/checkout@v4
        with:
          repository: CrisBezz/BoxLab
          ref: release/beta-1
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Beta site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Beta site
        id: deployment
        uses: actions/deploy-pages@v4
